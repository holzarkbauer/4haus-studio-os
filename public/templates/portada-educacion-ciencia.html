<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Educación y ciencia · Plantilla de portada · 4haus Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--ink:#f5f5f7;--muted:#a1a1a6;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 6vw;font-size:14px;color:var(--muted)}
header b{color:var(--ink);font-weight:600}
.hero{display:grid;grid-template-columns:1fr 1.25fr;gap:4vw;align-items:center;min-height:calc(100vh - 64px);padding:0 6vw 6vh}
.kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(40px,6vw,84px);line-height:1.02;letter-spacing:-.035em;margin:.3em 0 .35em}
p.sub{font-size:clamp(17px,1.6vw,21px);line-height:1.5;color:var(--muted);max-width:30em}
.cta{display:inline-block;margin-top:28px;background:var(--ink);color:#0b0b0c;padding:14px 26px;border-radius:999px;font-weight:600;text-decoration:none}
.figure{width:100%;height:min(66vh,520px);border:0;border-radius:24px;background:transparent}
footer{border-top:1px solid var(--line);padding:18px 6vw;font-size:12px;color:var(--muted)}
footer a{color:var(--muted)}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding-top:4vh}.figure{height:92vw;min-height:380px}}
</style></head>
<body>
<header><b>[Tu marca]</b><span>Servicios · Proyectos · Contacto</span></header>
<main class="hero">
  <div>
    <div class="kicker">Educación y ciencia</div>
    <h1>Aprender se ve así.</h1>
    <p class="sub">Cursos, laboratorios y programas que muestran cómo funcionan las cosas de verdad.</p>
    <a class="cta" href="#contacto">Ver programas</a>
  </div>
  <!-- Ilustración isométrica interactiva: pasa el cursor o usa el teclado sobre ella. -->
  <iframe class="figure" src="anatomy/ripple-tank-figura.html" title="Ilustración interactiva" loading="lazy"></iframe>
</main>
<footer>Plantilla de portada de 4haus Studio. Ilustración hecha con <a href="https://github.com/wheresryan22/anatomy" rel="noopener">Anatomy</a> (licencia MIT).</footer>
</body></html>
